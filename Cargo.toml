[package]
name = "mp305"
version = "0.1.0"
edition = "2024"
description = "CLI and library to control the ISDT MP305 (MP305A/MP305B) bench power supply over USB-HID"
license = "MIT"
repository = "https://github.com/mstaack/isdt-mp305-control"
homepage = "https://github.com/mstaack/isdt-mp305-control"
readme = "README.md"
keywords = ["isdt", "mp305", "power-supply", "hid", "cli"]
categories = ["command-line-utilities", "hardware-support"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
